<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>الانتقال إلى بوابة طلاب اوميجا</title>
<script>
/* Compatibility for old shared lesson URLs. All content now lives inside student.html. */
(function(){
 const old=new URLSearchParams(location.search);
 const type=old.get("type")||"lesson";
 const route=new URLSearchParams({type});
 for(const key of ["subject","id"]){
   if(old.has(key))route.set(key,old.get(key));
 }
 const target=new URL("student.html",location.href);
 target.hash="omega-study?"+route.toString();
 location.replace(target.href);
})();
</script>
<style>body{font:16px/1.9 system-ui,sans-serif;text-align:center;margin:15vh auto;padding:24px;max-width:600px;color:#162c48}a{color:#16803c}</style>
</head>
<body><p>تم دمج الدروس والمواد داخل صفحة الطالب نفسها.</p><a href="student.html">العودة إلى بوابة الطلاب</a></body>
</html>
